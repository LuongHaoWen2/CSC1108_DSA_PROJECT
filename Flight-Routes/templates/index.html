<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Flight Route Finder</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

        :root {
            --bg:        #0a0e1a;
            --panel:     #111827;
            --border:    #1e2d40;
            --accent:    #00d4ff;
            --accent2:   #7c3aed;
            --text:      #e2e8f0;
            --muted:     #64748b;
            --success:   #10b981;
            --warning:   #f59e0b;
            --danger:    #ef4444;
            --route-clr: #00d4ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* ── Map ── */
        #map-container {
            flex: 1;
            height: 100vh;
            position: relative;
        }

        .leaflet-container {
            background: #060b14 !important;
        }

        /* ── Panel ── */
        #panel {
            width: 360px;
            min-width: 360px;
            height: 100vh;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #panel-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
        }

        #panel-header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
        }

        #panel-header p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
        }

        #panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        /* ── Form ── */
        .field { margin-bottom: 14px; }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .field select,
        .field input {
            width: 100%;
            background: #0d1526;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 9px 12px;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .field select:focus,
        .field input:focus {
            border-color: var(--accent);
        }

        .row-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Select2 dark overrides */
        .select2-container--default .select2-selection--single {
            background: #0d1526 !important;
            border: 1px solid var(--border) !important;
            border-radius: 6px !important;
            height: 38px !important;
            display: flex;
            align-items: center;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--text) !important;
            line-height: 38px !important;
            padding-left: 12px !important;
            font-size: 13px;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            top: 6px !important;
        }

        .select2-dropdown {
            background: #111827 !important;
            border: 1px solid var(--border) !important;
            border-radius: 6px !important;
        }

        .select2-container--default .select2-results__option {
            color: var(--text) !important;
            font-size: 13px;
            padding: 8px 12px;
        }

        .select2-container--default .select2-results__option--highlighted {
            background: var(--accent2) !important;
        }

        .select2-search--dropdown .select2-search__field {
            background: #0d1526 !important;
            border: 1px solid var(--border) !important;
            color: var(--text) !important;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
        }

        /* ── Button ── */
        #find-btn {
            width: 100%;
            padding: 11px;
            background: var(--accent);
            color: #0a0e1a;
            border: none;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 4px;
            transition: opacity 0.2s, transform 0.1s;
        }

        #find-btn:hover  { opacity: 0.85; }
        #find-btn:active { transform: scale(0.98); }
        #find-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Divider ── */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 18px 0;
        }

        /* ── Status ── */
        #status {
            font-size: 12px;
            min-height: 18px;
            margin-bottom: 10px;
        }

        #status.loading { color: var(--accent); }
        #status.error   { color: var(--danger); }
        #status.success { color: var(--success); }

        /* ── Summary ── */
        #summary { display: none; }

        #summary h3 {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: #0d1526;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 8px;
            text-align: center;
        }

        .stat-card .val {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-card .lbl {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ── Path display ── */
        #path-display {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            margin-bottom: 14px;
        }

        .path-code {
            background: var(--accent2);
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .path-arrow {
            color: var(--muted);
            font-size: 12px;
        }

        /* ── Segments ── */
        .segment {
            background: #0d1526;
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent2);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .segment .seg-route {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .segment .seg-detail {
            color: var(--muted);
            font-size: 11px;
        }

        /* ── All routes list ── */
        #routes-list { margin-top: 8px; }

        .route-item {
            background: #0d1526;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 9px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Space Mono', monospace;
            color: var(--text);
            transition: border-color 0.2s, background 0.2s;
            width: 100%;
            text-align: left;
        }

        .route-item:hover {
            border-color: var(--accent);
            background: #111e35;
        }

        .route-item.active {
            border-color: var(--accent);
            background: #0f1f38;
        }

        /* ── Map overlay ── */
        #map-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(10, 14, 26, 0.85);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        #map-overlay span {
            color: var(--accent);
        }
    </style>
</head>
<body>

<!-- Map -->
<div id="map-container">
    <div id="map-overlay">
        FLIGHT ROUTE FINDER &nbsp;|&nbsp; <span id="airport-count">loading...</span> airports
    </div>
</div>

<!-- Panel -->
<div id="panel">
    <div id="panel-header">
        <h1>Route Finder</h1>
        <p>Powered by BFS · DFS · Dijkstra</p>
    </div>

    <div id="panel-body">

        <!-- Form -->
        <div class="field">
            <label>Origin</label>
            <select id="origin" class="searchable">
                <option value="">Select origin airport</option>
            </select>
        </div>

        <div class="field">
            <label>Destination</label>
            <select id="destination" class="searchable">
                <option value="">Select destination airport</option>
            </select>
        </div>

        <div class="field">
            <label>Route preference</label>
            <select id="preference">
                <option value="distance">Shortest Distance</option>
                <option value="price">Lowest Price</option>
                <option value="time">Fastest Time</option>
                <option value="fewest_hops">Fewest Layovers</option>
                <option value="dfs">All Routes (DFS)</option>
            </select>
        </div>

        <div class="row-fields">
            <div class="field">
                <label>Max stops</label>
                <input type="number" id="max_stops" value="3" min="1" max="6"/>
            </div>
            <div class="field">
                <label>Avoid airport</label>
                <select id="avoid" class="searchable">
                    <option value="">None</option>
                </select>
            </div>
        </div>

        <button id="find-btn">Find Route</button>

        <hr class="divider"/>

        <div id="status"></div>

        <!-- Summary -->
        <div id="summary">
            <h3>Route Summary</h3>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="val" id="stat-dist">—</div>
                    <div class="lbl">km</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="stat-price">—</div>
                    <div class="lbl">USD</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="stat-time">—</div>
                    <div class="lbl">min</div>
                </div>
            </div>

            <div id="path-display"></div>
            <div id="segments"></div>
            <div id="routes-list"></div>
        </div>

    </div>
</div>

<script>
// ── Map setup ──────────────────────────────────────────
const map = L.map('map-container', {
    center: [20, 0],
    zoom: 3,
    minZoom: 2,
    maxZoom: 10,
    zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    subdomains: 'abcd',
    maxZoom: 10
}).addTo(map);

let routeLayer   = null;
let markerLayer  = L.layerGroup().addTo(map);
let airportCache = {};

// ── Load airports ──────────────────────────────────────
async function loadAirports() {
    const res  = await fetch('/api/airports');
    const data = await res.json();
    const codes = data.airports.sort();

    document.getElementById('airport-count').textContent = codes.length;

    ['#origin', '#destination', '#avoid'].forEach(sel => {
        const el = $(sel);
        codes.forEach(code => el.append(new Option(code, code)));
        el.select2({ placeholder: 'Type to search', width: '100%' });
    });
}

// ── Get airport info (cached) ──────────────────────────
async function getAirport(code) {
    if (airportCache[code]) return airportCache[code];
    const res  = await fetch(`/api/airports/${code}`);
    const data = await res.json();
    airportCache[code] = data;
    return data;
}

// ── Draw route on map ──────────────────────────────────
async function drawRoute(path) {
    if (routeLayer) map.removeLayer(routeLayer);
    markerLayer.clearLayers();

    const coords = [];

    for (const code of path) {
        const info = await getAirport(code);
        if (!info.latitude || !info.longitude) continue;

        const lat = parseFloat(info.latitude);
        const lng = parseFloat(info.longitude);
        coords.push([lat, lng]);

        const isEnd = code === path[0] || code === path[path.length - 1];

        L.circleMarker([lat, lng], {
            radius:      isEnd ? 7 : 5,
            fillColor:   isEnd ? '#00d4ff' : '#7c3aed',
            color:       '#fff',
            weight:      1.5,
            opacity:     1,
            fillOpacity: 1
        }).addTo(markerLayer)
          .bindPopup(`<b style="color:#00d4ff">${code}</b><br>${info.name}`);
    }

    routeLayer = L.polyline(coords, {
        color:   '#00d4ff',
        weight:  2,
        opacity: 0.8,
        dashArray: '6 4'
    }).addTo(map);

    if (coords.length > 1) {
        map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });
    }
}

// ── Build path display ─────────────────────────────────
function renderPath(path) {
    const el = document.getElementById('path-display');
    el.innerHTML = path.map((code, i) =>
        i < path.length - 1
            ? `<span class="path-code">${code}</span><span class="path-arrow">→</span>`
            : `<span class="path-code">${code}</span>`
    ).join('');
}

// ── Build segments ─────────────────────────────────────
async function renderSegments(path) {
    const el = document.getElementById('segments');
    el.innerHTML = '';

    let totalDist = 0, totalPrice = 0, totalTime = 0;

    for (let i = 0; i < path.length - 1; i++) {
        const from = path[i];
        const to   = path[i + 1];

        const res  = await fetch(`/api/cheapest?start=${from}&end=${to}`);
        const data = await res.json();

        if (data.path) {
            const segDist  = 0;
            const segPrice = data.total_price || 0;
            totalPrice += segPrice;

            el.innerHTML += `
                <div class="segment">
                    <div class="seg-route">${from} → ${to}</div>
                    <div class="seg-detail">$${segPrice.toFixed(2)}</div>
                </div>`;
        }
    }

    document.getElementById('stat-price').textContent = `$${totalPrice.toFixed(0)}`;
}

// ── Show summary ───────────────────────────────────────
function showSummary(path, dist, price, time) {
    document.getElementById('summary').style.display = 'block';
    document.getElementById('stat-dist').textContent  = dist  ? Math.round(dist)  : '—';
    document.getElementById('stat-price').textContent = price ? `$${Math.round(price)}` : '—';
    document.getElementById('stat-time').textContent  = time  ? Math.round(time)  : '—';
    document.getElementById('routes-list').innerHTML  = '';
    renderPath(path);
    drawRoute(path);
}

// ── Find route ─────────────────────────────────────────
document.getElementById('find-btn').addEventListener('click', async () => {
    const origin      = document.getElementById('origin').value;
    const destination = document.getElementById('destination').value;
    const preference  = document.getElementById('preference').value;
    const max_stops   = document.getElementById('max_stops').value;
    const avoid       = document.getElementById('avoid').value;

    const status = document.getElementById('status');

    if (!origin || !destination) {
        status.className = 'error';
        status.textContent = 'Please select origin and destination.';
        return;
    }

    if (origin === destination) {
        status.className = 'error';
        status.textContent = 'Origin and destination cannot be the same.';
        return;
    }

    status.className = 'loading';
    status.textContent = 'Searching...';
    document.getElementById('find-btn').disabled = true;
    document.getElementById('summary').style.display = 'none';

    try {
        let url, res, data;
        const avoidParam = avoid ? `&avoid=${avoid}` : '';

        if (preference === 'dfs') {
            url  = `/api/all-routes?start=${origin}&end=${destination}&max_stops=${max_stops}${avoidParam}`;
            res  = await fetch(url);
            data = await res.json();

            if (!res.ok) throw new Error(data.error);

            status.className   = 'success';
            status.textContent = `Found ${data.total_found} routes`;

            document.getElementById('summary').style.display = 'block';
            document.getElementById('stat-dist').textContent  = '—';
            document.getElementById('stat-price').textContent = '—';
            document.getElementById('stat-time').textContent  = '—';
            document.getElementById('segments').innerHTML     = '';

            renderPath(data.routes[0]);
            drawRoute(data.routes[0]);

            const listEl = document.getElementById('routes-list');
            listEl.innerHTML = '';
            data.routes.forEach((route, i) => {
                const btn = document.createElement('button');
                btn.className   = 'route-item' + (i === 0 ? ' active' : '');
                btn.textContent = route.join(' → ');
                btn.onclick = () => {
                    document.querySelectorAll('.route-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPath(route);
                    drawRoute(route);
                };
                listEl.appendChild(btn);
            });

        } else if (preference === 'fewest_hops') {
            url  = `/api/fewest-layovers?start=${origin}&end=${destination}${avoidParam}`;
            res  = await fetch(url);
            data = await res.json();

            if (!res.ok) throw new Error(data.error);

            status.className   = 'success';
            status.textContent = `${data.stops} layover(s)`;
            showSummary(data.path, null, null, null);
            document.getElementById('segments').innerHTML = '';

        } else {
            const epMap = { distance: 'shortest', price: 'cheapest', time: 'fastest' };
            url  = `/api/${epMap[preference]}?start=${origin}&end=${destination}`;
            res  = await fetch(url);
            data = await res.json();

            if (!res.ok) throw new Error(data.error);

            const dist  = data.total_distance || null;
            const price = data.total_price    || null;
            const time  = data.total_time     || null;
            const total = dist ?? price ?? time;

            status.className   = 'success';
            status.textContent = `Total: ${total}`;
            showSummary(data.path, dist, price, time);
            document.getElementById('segments').innerHTML = '';
        }

    } catch (e) {
        status.className   = 'error';
        status.textContent = e.message || 'No route found.';
    }

    document.getElementById('find-btn').disabled = false;
});

// ── Init ───────────────────────────────────────────────
loadAirports();
</script>
</body>
</html>
